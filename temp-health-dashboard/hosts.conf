#!/usr/bin/env bash

# Map dashboard host names to one or more IPs for real ICMP checks.
declare -Ag HOST_IPS=(
  [localhost]="127.0.0.1"
)

# Optional SSH target override per host. Defaults to the IP, with SSH_USER prepended if set.
declare -Ag HOST_SSH_TARGETS=(
  [localhost]="127.0.0.1"
)

# Real remote systemd units checked with: systemctl is-active <unit>
declare -Ag HOST_SERVICES=(
  [localhost]="ssh,docker"
)

# Real remote Docker containers. Leave a host unset/empty to discover containers with docker ps.
declare -Ag HOST_CONTAINERS=(
  [localhost]=""
)

