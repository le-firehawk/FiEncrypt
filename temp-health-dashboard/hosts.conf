#!/usr/bin/env bash

# Define each host exactly once. Put every address for that same host in one
# comma-separated string; repeating the same associative-array key later will
# overwrite the earlier value in Bash, which makes it look like only the last IP
# was tested.
declare -Ag HOST_IPS=(
  # Correct: one host key, multiple IPs. The dashboard renders/tests one row per IP.
  [localhost]="127.0.0.1,::1"

  # Correct: another host with multiple addresses.
  # [edge-a]="10.0.0.10,10.0.1.10,2001:db8::10"

  # Incorrect: duplicate keys overwrite, so only 10.0.1.10 would remain.
  # [edge-a]="10.0.0.10"
  # [edge-a]="10.0.1.10"
)

# Real remote systemd units checked with: systemctl is-active <unit>. The
# dashboard renders one row per unit with templated guidance for active,
# inactive, failed, and unknown states.
declare -Ag HOST_SERVICES=(
  [localhost]="ssh,docker"
  # [edge-a]="ssh,nginx,docker"
)

# Real remote Docker containers. Leave a host unset/empty to discover containers with docker ps on every IP.
declare -Ag HOST_CONTAINERS=(
  [localhost]=""
  # [edge-a]="gateway,metrics"
)

# Time synchronization checks run over SSH with timedatectl plus chronyc/ntpq
# source detection. Use 1/yes to run the NTP test for a host, or 0/no/false to
# skip it while still rendering a TIMESYNC=SKIPPED row.
declare -Ag HOST_TIMESYNC=(
  [localhost]="1"
  # [edge-a]="1"
)

# Optional SSH jump routing. Values are comma-separated host names from HOST_IPS.
# Example: myserver goes through myhost1, then myhost2; if myhost2 itself goes
# through myhost, myserver inherits that hop before myhost2.
declare -Ag HOSTS_VIA=(
  # [myserver]="myhost1,myhost2"
  # [myhost2]="myhost"
)

# Optional media streams reachable from each host. Values are comma-separated URLs.
declare -Ag HOST_STREAMS=(
  # [localhost]=""
  # [edge-a]="rtsp://camera-a.local/stream,http://media.local/live.m3u8"
)

# SSH_USER="ops"
# SUDO_USER defaults to SSH_USER and is fixed by this config. The TUI asks once
# per host for the sudo password before the first systemd start/stop/restart
# action and stores it separately from SSH passwords for the current run.
# SUDO_USER="ops"
# SSH_OPTS="-o StrictHostKeyChecking=accept-new"
# If interactive password auth is used, the TUI asks once per host and reuses
# that host password for every configured IP and SSH-backed check in the run.
# Retry transient SSH transport failures (for example a timeout or an SSH exit
# with no stderr) before marking SSH-dependent checks as failed.
# SSH_CHECK_RETRIES=1
# DOCKER_LOG_LINES=40
